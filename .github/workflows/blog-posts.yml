name: Latest blog posts

on:
  schedule:
    - cron: "17 6 * * *" # daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://www.zal-group.com/feed.xml"
          max_post_count: 5
          remove_duplicates: true
          template: "- [$title]($url)$newline"
          commit_message: "Update latest blog posts"
